server:
  port: 8080

spring:
  config:
    import: "optional:configserver:http://localhost:8071/"
  datasource: 
    url: jdbc:h2:mem:testdb  
    driverClassName: org.h2.Driver
    username: sa
    password: ''

  profiles:
    active: "prod"  
  h2:
   console:
     enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
      show-sql: true  

  application:
    name: "accounts"

build:
  version: "3.0"  



